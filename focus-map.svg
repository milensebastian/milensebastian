<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Engineering focus map</title>
  <desc id="d">Milen at the centre, connected to five focus areas: security, software, systems, vision and foundations.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#26364D" stroke-width="0.5" opacity="0.55"/>
    </pattern>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1B2F5A"/>
      <stop offset="1" stop-color="#101B30"/>
    </radialGradient>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="818" height="318" rx="14" fill="#080B12" stroke="#26364D"/>
  <rect x="1" y="1" width="818" height="318" rx="14" fill="url(#grid)"/>

  <!-- title strip -->
  <text x="22" y="28" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#77869D" letter-spacing="1.5">FOCUS_MAP.SVG</text>
  <circle cx="790" cy="23" r="4" fill="#70AFFF">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- links: centre (410,170) to each node centre -->
  <g stroke="#4D8DFF" stroke-width="1.2" stroke-dasharray="4 6" fill="none" opacity="0.8">
    <path d="M410 170 L410 66">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M410 170 L150 110">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M410 170 L170 262">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M410 170 L670 110">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M410 170 L650 262">
      <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- packets travelling along the links -->
  <g fill="#A8D0FF">
    <circle r="3"><animateMotion dur="3.2s" repeatCount="indefinite" path="M410 170 L410 66"/></circle>
    <circle r="3"><animateMotion dur="3.8s" repeatCount="indefinite" path="M410 170 L150 110"/></circle>
    <circle r="3"><animateMotion dur="4.4s" repeatCount="indefinite" path="M410 170 L170 262"/></circle>
    <circle r="3"><animateMotion dur="3.5s" repeatCount="indefinite" path="M410 170 L670 110"/></circle>
    <circle r="3"><animateMotion dur="4.1s" repeatCount="indefinite" path="M410 170 L650 262"/></circle>
  </g>

  <!-- centre node -->
  <circle cx="410" cy="170" r="46" fill="none" stroke="#70AFFF" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="40;54;40" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="410" cy="170" r="38" fill="url(#core)" stroke="#70AFFF" stroke-width="1.5"/>
  <text x="410" y="167" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700" fill="#EAF2FF">MILEN</text>
  <text x="410" y="183" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="8.5" fill="#70AFFF" letter-spacing="1">BUILD · LEARN</text>

  <!-- node: foundations (top) -->
  <g>
    <rect x="330" y="43" width="160" height="46" rx="8" fill="#111824" stroke="#26364D"/>
    <text x="410" y="62" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#EAF2FF">FOUNDATIONS</text>
    <text x="410" y="78" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#A6B2C5">DSA · problem solving</text>
  </g>

  <!-- node: security (left top) -->
  <g>
    <rect x="70" y="87" width="160" height="46" rx="8" fill="#111824" stroke="#26364D"/>
    <text x="150" y="106" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#EAF2FF">SECURITY</text>
    <text x="150" y="122" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#A6B2C5">crypto · web security</text>
  </g>

  <!-- node: software (left bottom) -->
  <g>
    <rect x="90" y="239" width="160" height="46" rx="8" fill="#111824" stroke="#26364D"/>
    <text x="170" y="258" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#EAF2FF">SOFTWARE</text>
    <text x="170" y="274" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#A6B2C5">build · architecture</text>
  </g>

  <!-- node: systems (right top) -->
  <g>
    <rect x="590" y="87" width="160" height="46" rx="8" fill="#111824" stroke="#26364D"/>
    <text x="670" y="106" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#EAF2FF">SYSTEMS</text>
    <text x="670" y="122" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#A6B2C5">p2p · networking</text>
  </g>

  <!-- node: vision (right bottom) -->
  <g>
    <rect x="570" y="239" width="160" height="46" rx="8" fill="#111824" stroke="#26364D"/>
    <text x="650" y="258" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#EAF2FF">VISION</text>
    <text x="650" y="274" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#A6B2C5">gestures · 3D</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
