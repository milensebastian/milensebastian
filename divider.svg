<svg xmlns="http://www.w3.org/2000/svg" width="800" height="28" viewBox="0 0 800 28" role="img" aria-label="Section divider" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Section divider</title>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26364D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#26364D"/>
      <stop offset="1" stop-color="#26364D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70AFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A8D0FF"/>
      <stop offset="1" stop-color="#70AFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="railClip">
      <rect x="40" y="0" width="720" height="28"/>
    </clipPath>
  </defs>

  <!-- static rail -->
  <rect x="40" y="13" width="720" height="2" fill="url(#rail)"/>

  <!-- tick marks, like a measurement scale -->
  <g stroke="#26364D" stroke-width="1" opacity="0.9">
    <line x1="160" y1="9" x2="160" y2="19"/>
    <line x1="220" y1="11" x2="220" y2="17"/>
    <line x1="280" y1="9" x2="280" y2="19"/>
    <line x1="340" y1="11" x2="340" y2="17"/>
    <line x1="460" y1="11" x2="460" y2="17"/>
    <line x1="520" y1="9" x2="520" y2="19"/>
    <line x1="580" y1="11" x2="580" y2="17"/>
    <line x1="640" y1="9" x2="640" y2="19"/>
  </g>

  <!-- travelling pulse -->
  <g clip-path="url(#railClip)">
    <rect x="-140" y="12" width="140" height="4" rx="2" fill="url(#pulse)">
      <animate attributeName="x" values="-140;800" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- centre marker -->
  <rect x="396" y="10" width="8" height="8" transform="rotate(45 400 14)" fill="#080B12" stroke="#70AFFF" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.5s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
