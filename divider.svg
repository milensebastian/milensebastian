<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 44" width="800" height="44" role="img" aria-labelledby="div-t div-d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="div-t">Section divider</title>
  <desc id="div-d">A thin signal rail with a travelling pulse that lights five nodes in turn.</desc>
  <defs>
    <linearGradient id="div-rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4D8DFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4D8DFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4D8DFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="div-pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70AFFF" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#A8D0FF"/>
      <stop offset="1" stop-color="#70AFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="div-glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="div-clip"><rect x="30" y="0" width="740" height="44"/></clipPath>
  </defs>
  <rect x="30" y="21" width="740" height="2" fill="url(#div-rail)"/>
  <path d="M30 22C110 6 190 38 270 22S430 6 510 22S670 38 770 22" fill="none" stroke="#4D8DFF" stroke-width="1.2" stroke-dasharray="2 8" opacity="0.55">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2s" repeatCount="indefinite"/>
  </path>
  <g clip-path="url(#div-clip)">
    <rect x="-160" y="19" width="160" height="6" rx="3" fill="url(#div-pulse)" filter="url(#div-glow)" opacity="0.8">
      <animate attributeName="x" values="-160;800;800" keyTimes="0;0.75;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="-160" y="20.5" width="160" height="3" rx="1.5" fill="url(#div-pulse)">
      <animate attributeName="x" values="-160;800;800" keyTimes="0;0.75;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="100" cy="22" r="3.5" fill="#70AFFF" opacity="0.55"><animate attributeName="r" values="3.5;3.5;7;3.5;3.5" keyTimes="0;0.1;0.14;0.24;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0.1;0.14;0.24;1" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="250" cy="22" r="3.5" fill="#70AFFF" opacity="0.55"><animate attributeName="r" values="3.5;3.5;7;3.5;3.5" keyTimes="0;0.22;0.26;0.36;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0.22;0.26;0.36;1" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="22" r="3.5" fill="#70AFFF" opacity="0.55"><animate attributeName="r" values="3.5;3.5;7;3.5;3.5" keyTimes="0;0.34;0.38;0.47;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0.34;0.38;0.47;1" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="550" cy="22" r="3.5" fill="#70AFFF" opacity="0.55"><animate attributeName="r" values="3.5;3.5;7;3.5;3.5" keyTimes="0;0.45;0.49;0.59;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0.45;0.49;0.59;1" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="22" r="3.5" fill="#70AFFF" opacity="0.55"><animate attributeName="r" values="3.5;3.5;7;3.5;3.5" keyTimes="0;0.57;0.61;0.71;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.5;1;0.5;0.5" keyTimes="0;0.57;0.61;0.71;1" dur="8s" repeatCount="indefinite"/></circle>
  <circle r="1.8" fill="#70AFFF" opacity="0"><animateMotion dur="8s" begin="0s" repeatCount="indefinite" path="M30 22C110 6 190 38 270 22S430 6 510 22S670 38 770 22"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="8s" begin="0s" repeatCount="indefinite"/></circle>
  <circle r="1.8" fill="#70AFFF" opacity="0"><animateMotion dur="8s" begin="-2.7s" repeatCount="indefinite" path="M30 22C110 6 190 38 270 22S430 6 510 22S670 38 770 22"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="8s" begin="-2.7s" repeatCount="indefinite"/></circle>
