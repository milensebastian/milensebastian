<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-labelledby="foot-t foot-d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="foot-t">Build with curiosity</title>
  <desc id="foot-d">Animated footer banner with layered waves, rising particles and a scanning beam over the words BUILD WITH CURIOSITY. Learning continuously. Building intentionally.</desc>
  <defs>
    <linearGradient id="foot-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080B12"/><stop offset="1" stop-color="#101B30"/>
    </linearGradient>
    <linearGradient id="foot-w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2F5A" stop-opacity="0.9"/><stop offset="1" stop-color="#101B30"/>
    </linearGradient>
    <linearGradient id="foot-w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151E2D" stop-opacity="0.95"/><stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="foot-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70AFFF" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#70AFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#A8D0FF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="foot-rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4D8DFF" stop-opacity="0"/><stop offset="0.5" stop-color="#4D8DFF" stop-opacity="0.7"/><stop offset="1" stop-color="#4D8DFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foot-pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70AFFF" stop-opacity="0"/><stop offset="0.7" stop-color="#A8D0FF"/><stop offset="1" stop-color="#70AFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="foot-vig" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0.4" stop-color="#080B12" stop-opacity="0"/><stop offset="1" stop-color="#080B12" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="foot-blur" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1000" height="230" fill="url(#foot-bg)"/>
  <g opacity="0.35"><path d="M-40 -40V270M0 -40V270M40 -40V270M80 -40V270M120 -40V270M160 -40V270M200 -40V270M240 -40V270M280 -40V270M320 -40V270M360 -40V270M400 -40V270M440 -40V270M480 -40V270M520 -40V270M560 -40V270M600 -40V270M640 -40V270M680 -40V270M720 -40V270M760 -40V270M800 -40V270M840 -40V270M880 -40V270M920 -40V270M960 -40V270M1000 -40V270M1040 -40V270M-40 -40H1040M-40 0H1040M-40 40H1040M-40 80H1040M-40 120H1040M-40 160H1040M-40 200H1040M-40 240H1040M-40 280H1040" fill="none" stroke="#26364D" stroke-width="1"><animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="16s" repeatCount="indefinite"/></path></g>
  <rect width="1000" height="230" fill="url(#foot-vig)"/>

  <!-- top rail: same signal rhythm as the header -->
  <rect x="40" y="14" width="920" height="1.5" fill="url(#foot-rail)"/>
  <rect x="-200" y="12.5" width="160" height="4" rx="2" fill="url(#foot-pulse)">
