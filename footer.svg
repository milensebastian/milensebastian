    <circle cx="532.51" cy="198.48" r="1.1" fill="#70AFFF" opacity="0"><animate attributeName="cy" values="198.48;48.48" dur="8s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.5;1" dur="8s" begin="-0.7s" repeatCount="indefinite"/></circle>
