    <circle cx="426.19" cy="188.17" r="1.1" fill="#70AFFF" opacity="0"><animate attributeName="cy" values="188.17;38.17" dur="8s" begin="-2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.5;1" dur="8s" begin="-2.1s" repeatCount="indefinite"/></circle>
