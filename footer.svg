    <circle cx="703.29" cy="180.33" r="1.8" fill="#70AFFF" opacity="0"><animate attributeName="cy" values="180.33;30.33" dur="16s" begin="-12.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.5;1" dur="16s" begin="-12.3s" repeatCount="indefinite"/></circle>
