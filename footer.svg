  <!-- scan beam -->
  <rect x="-200" y="0" width="160" height="230" fill="url(#foot-beam)">
    <animate attributeName="x" values="-200;1040;1040" keyTimes="0;0.75;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- words -->
  <g>
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    <text x="500" y="98" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="40" font-weight="700" letter-spacing="5" fill="#70AFFF" opacity="0.45" filter="url(#foot-blur)">BUILD WITH CURIOSITY.
      <animate attributeName="opacity" values="0.3;0.55;0.3" dur="4s" repeatCount="indefinite"/></text>
    <text x="500" y="98" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="40" font-weight="700" letter-spacing="5" fill="#EAF2FF">BUILD WITH CURIOSITY.</text>
    <text x="500" y="132" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="16" letter-spacing="1.5" fill="#A6B2C5">Learning continuously. Building intentionally.</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.3;0.38;0.45;1" dur="8s" repeatCount="indefinite"/>
      <text x="500" y="98" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="40" font-weight="700" letter-spacing="5" fill="#70AFFF">BUILD WITH CURIOSITY.</text>
    </g>
