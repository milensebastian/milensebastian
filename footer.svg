    <circle cx="887.32" cy="189.04" r="1.8" fill="#70AFFF" opacity="0"><animate attributeName="cy" values="189.04;39.04" dur="8s" begin="-2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.5;1" dur="8s" begin="-2.1s" repeatCount="indefinite"/></circle>
    <circle cx="119.7" cy="206.43" r="1.8" fill="#70AFFF" opacity="0"><animate attributeName="cy" values="206.43;56.43" dur="8s" begin="-2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.5;1" dur="8s" begin="-2.6s" repeatCount="indefinite"/></circle>
    <circle cx="153.89" cy="203.66" r="0.8" fill="#70AFFF" opacity="0"><animate attributeName="cy" values="203.66;53.66" dur="16s" begin="-2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.5;1" dur="16s" begin="-2.7s" repeatCount="indefinite"/></circle>
    <circle cx="959.81" cy="154.03" r="1.8" fill="#70AFFF" opacity="0"><animate attributeName="cy" values="154.03;4.03" dur="16s" begin="-0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.5;1" dur="16s" begin="-0.4s" repeatCount="indefinite"/></circle>
    <circle cx="799.66" cy="199.48" r="1.1" fill="#70AFFF" opacity="0"><animate attributeName="cy" values="199.48;49.48" dur="8s" begin="-4.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.5;1" dur="8s" begin="-4.3s" repeatCount="indefinite"/></circle>
